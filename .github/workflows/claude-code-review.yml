name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Record untrusted PR review policy
        if: >-
          github.event.pull_request.user.login == 'dependabot[bot]' ||
          github.event.pull_request.head.repo.fork
        run: echo "Untrusted PRs use check, public E2E, Lighthouse, and CodeQL; Claude credentials are intentionally unavailable to bot-authored and fork workflows."

      - name: Run Claude Code Review
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.fork != true
        id: claude-review
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The Claude App rejects OIDC exchange unless the workflow is
          # byte-identical to the default branch, so a PR that edits this file
          # could not be reviewed; the repository token avoids that.
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # v1 automation mode requires the repository and PR context in the
          # prompt. A direct prompt starts the review without an @claude mention.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Be constructive and helpful in your feedback.

          # v1 routes CLI configuration through claude_args. Keep the model
          # pinned so a provider-default retirement cannot silently break CI.
          claude_args: |
            --model claude-sonnet-5
