name: CI

on:
  pull_request:
  push:
    branches: [main, rebuild/vercel-platform]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No sync-duplicate files
        run: |
          if git ls-files | grep -E ' [0-9]+(\.|$)' ; then
            echo "Filesystem-sync duplicate files are tracked; remove them." >&2
            exit 1
          fi
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit the full dependency graph
        # CVE-2026-14257's registry range currently marks every historical
        # major vulnerable even though brace-expansion backported the fix to
        # v1.1.17. The lockfile override pins that official v1 maintenance
        # release; no other advisory is ignored.
        run: pnpm audit --ignore CVE-2026-14257
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Migration files match the journal
        # drizzle-kit check finds schema drift but not a journal entry whose
        # .sql file is gone — which is what broke three deploys after a rebase
        # renamed one to "... 2.sql" and the apparent duplicate was deleted.
        run: pnpm check:migrations
      - name: Check migration drift
        run: pnpm db:check
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci

  e2e-public:
    runs-on: ubuntu-latest
    needs: check
    env:
      E2E_DB: "0"
      E2E_EDITOR_MUTATIONS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium firefox webkit --with-deps
      - name: Public cross-browser acceptance
        run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-public-report
          path: playwright-report
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-public-screenshots
          path: e2e/screenshots
          retention-days: 14

  e2e-db:
    # Secrets are intentionally unavailable to Dependabot and forked refs.
    # Keep this as a separately named trusted acceptance gate so a public smoke
    # pass can never be mistaken for authenticated editor/database coverage.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.fork != true)
    runs-on: ubuntu-latest
    needs: check
    concurrency:
      # The suite deliberately resets one isolated Neon branch before it runs.
      # Serialize every ref so two PRs cannot mutate the fixture set together.
      group: sopher-isolated-e2e-database
      cancel-in-progress: false
    env:
      E2E_DB: "1"
      E2E_EDITOR_MUTATIONS: "1"
      E2E_DATABASE_ISOLATED: "1"
      # Lets wizard/browser acceptance create durable runs without invoking a
      # paid model or Vercel Workflow. The application additionally requires
      # non-production NODE_ENV and the isolated-database gate above.
      E2E_STUB_WORKFLOW: "1"
      E2E_FIXTURES_REQUIRED: "1"
      # Exact allowlist consumed by scripts/seed-e2e.ts. The password remains
      # only in E2E_DATABASE_URL.
      E2E_DATABASE_HOST: ep-bitter-mode-awgyoll1-pooler.c-12.us-east-1.aws.neon.tech
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium firefox webkit --with-deps
      - name: Validate the isolated Neon target before migration
        run: pnpm e2e:seed -- --dry-run
        env:
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      - name: Apply the current migration journal to isolated Neon
        run: pnpm exec drizzle-kit migrate
        env:
          # The preceding guard validates this same secret against the exact
          # disposable-host allowlist before it is ever assigned as DATABASE_URL.
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      - name: Seed the isolated Neon acceptance branch
        run: pnpm e2e:seed
        env:
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      - name: Real Neon transaction acceptance
        run: pnpm test:db-integration
        env:
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      - name: Authenticated database acceptance
        run: pnpm test:e2e
        env:
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-db-report
          path: playwright-report
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-db-screenshots
          path: e2e/screenshots
          retention-days: 14

  e2e:
    # Preserve the repository ruleset's required "e2e" context while keeping
    # public and trusted database acceptance visibly separate.
    if: always()
    runs-on: ubuntu-latest
    needs: [e2e-public, e2e-db]
    steps:
      - name: Require every applicable acceptance suite
        env:
          PUBLIC_RESULT: ${{ needs.e2e-public.result }}
          DATABASE_RESULT: ${{ needs.e2e-db.result }}
        run: |
          if [ "$PUBLIC_RESULT" != "success" ]; then
            echo "Public E2E did not pass: $PUBLIC_RESULT" >&2
            exit 1
          fi
          if [ "$DATABASE_RESULT" != "success" ] && [ "$DATABASE_RESULT" != "skipped" ]; then
            echo "Database E2E did not pass: $DATABASE_RESULT" >&2
            exit 1
          fi

  lighthouse:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - name: Expose Playwright Chromium to Lighthouse
        run: node -e 'console.log("CHROME_PATH=" + require("@playwright/test").chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Build the production application
        run: pnpm build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
          CLERK_SECRET_KEY: ""
      - name: Lighthouse production routes
        run: pnpm lighthouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 14
